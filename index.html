<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>きろくアプリ</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="きろく">
  <meta name="theme-color" content="#8ec5fc">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: linear-gradient(160deg, #8ec5fc 0%, #e0c3fc 55%, #ffd1e3 100%) fixed;
      font-family: 'Yusei Magic', 'Segoe UI', sans-serif; color: #fff;
    }
    #home {
      max-width: 420px; margin: 0 auto; min-height: 100vh; box-sizing: border-box;
      padding: calc(1.2em + env(safe-area-inset-top)) 16px calc(1.5em + env(safe-area-inset-bottom));
      display: flex; flex-direction: column;
    }
    #clock { text-align: center; margin: 1.2em 0 2em; text-shadow: 0 2px 8px #0002; }
    #clock .time { font-size: 3.6em; letter-spacing: 0.02em; line-height: 1; }
    #clock .date { font-size: 1em; margin-top: 0.4em; opacity: 0.9; }
    #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6em 1em; justify-items: center; }
    .app { display: flex; flex-direction: column; align-items: center; gap: 0.45em; text-decoration: none; color: #fff; width: 100%; }
    .app .icon {
      width: 72px; height: 72px; border-radius: 22%; display: flex; align-items: center; justify-content: center;
      font-size: 2.3em; box-shadow: 0 6px 16px #0002; transition: transform 0.12s;
    }
    .app:active .icon { transform: scale(0.9); }
    .app .label { font-size: 0.8em; text-shadow: 0 1px 4px #0004; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .app.empty .icon { background: #ffffff33; border: 2px dashed #ffffff88; box-shadow: none; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="home">
    <div id="clock"><div class="time"></div><div class="date"></div></div>
    <div id="grid"></div>
  </div>
  <script src="apps.js"></script>
  <script>
    const SLOT_COUNT = 9;
    const grid = document.getElementById('grid');
    // 9枠を基本に、10個以上になったら3の倍数まで行を増やす
    const total = Math.max(SLOT_COUNT, Math.ceil(APPS.length / 3) * 3);
    for (let i = 0; i < total; i++) {
      const app = APPS[i];
      const el = document.createElement(app ? 'a' : 'div');
      el.className = app ? 'app' : 'app empty';
      if (app) el.href = `apps/${app.id}/`;
      const icon = document.createElement('div');
      icon.className = 'icon';
      if (app) { icon.textContent = app.icon; icon.style.background = app.color; }
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = app ? app.name : '\u00a0'; // 空き枠はラベルなし（高さだけ確保）
      el.append(icon, label);
      grid.appendChild(el);
    }

    const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
    function tick() {
      const d = new Date();
      document.querySelector('#clock .time').textContent =
        `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
      document.querySelector('#clock .date').textContent =
        `${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）`;
    }
    tick();
    setInterval(tick, 10000);
  </script>
</body>
</html>
